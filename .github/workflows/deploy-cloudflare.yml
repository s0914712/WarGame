name: Deploy Wargame to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 獨立 group — 不與 deploy.yml 的 "pages" group 互搶
concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # Cloudflare Pages 在網域根目錄
          VITE_BASE_PATH: /
          # ⚠ 不要設 VITE_LLM_API_KEY — 會曝光在 client bundle
          VITE_WG_SUPABASE_URL: ${{ secrets.VITE_WG_SUPABASE_URL }}
          VITE_WG_SUPABASE_ANON_KEY: ${{ secrets.VITE_WG_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.86.0 pages deploy dist --project-name wargame --branch main --commit-dirty=true
